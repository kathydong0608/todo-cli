[pytest]
# 只收集 Python 版用例。根目录的 tests/ 是 JS 套件，由 npx playwright test 跑
testpaths = tests_py

# -n 4：并行 worker 数。本机 16 核，这里刻意不写 -n auto，因为实测 worker 开满反而更慢。
#
# 实测数据（30 个用例，Windows 11 / 16 核 / chromium-1243，取三次里最快的一次）：
#
#   -n auto（16 worker）   14.1s
#   -n 4                    9.0s   ← 最快
#   -n 0（串行）           26.4s
#
# 原因：瓶颈不是用例数量，而是「每个 xdist worker 都要冷启一个 chromium」。
# 16 个 worker 各自付一遍浏览器启动开销，并行收益被吃掉大半；4 个 worker
# 刚好把启动开销和并行度平衡掉。换个核数不同的机器，这个最优值会变，
# 可以按下面这个区间自己扫一遍：
#
#   for n in 2 4 6 8; do echo "n=$n"; python -m pytest -n $n -q; done
#
# 覆盖方式（命令行优先于 addopts）：
#   python -m pytest -n 0 -v     # 串行，调试时看完整 traceback 用
#   python -m pytest -n auto     # 按 CPU 核数铺满
addopts = -n 4
